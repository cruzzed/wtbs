# Django + uv. Only the serve port matters — declare exactly what you use.
# With a cloud/branching database (Neon, Supabase, ...), the DB lifecycle is
# a hook script that owns rewriting DATABASE_URL in the worktree .env — see
# the README ("project straps") for the Neon-shaped variant.

copy: [.env]

ports:
  serve: 8000

env:
  SERVE_PORT: "{ports.serve}"

hooks:
  create:
    - uv sync
    - uv run python manage.py migrate

aliases:
  serve: "uv run python manage.py runserver {ports.serve}"
  test: "uv run pytest"
  shell: "uv run python manage.py shell"
