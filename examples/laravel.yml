# Laravel + MySQL + Valet, expressed as straps.
# Sites are served by Valet (park the parent directory of your worktrees)
# at https://{site}.<valet-tld> — no app port is needed. valet secure/
# unsecure restart nginx internally, so the sudo password may be prompted
# for during create/destroy.

straps: [valet, mysql]

# Untracked files (.env, auth.json, ...) mirror from the main repo
# automatically (docs/adr/0008); exclude the heavy ones. The mysql strap
# writes DB_DATABASE into the worktree .env itself.

copy:
  ignore: [node_modules, vendor]

db_name: "myapp_{branch_slug}"

hooks:
  create:
    - composer install
    - npm ci
    - npm run build

aliases:
  serve: "php artisan serve"
  tinker: "php artisan tinker"
  migrate: "php artisan migrate"
  test: "php artisan test"
