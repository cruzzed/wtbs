# Laravel + MySQL + Valet, expressed as straps.
# Sites are served by Valet (park the parent directory of your worktrees).
# valet secure/unsecure restarts nginx internally, so the sudo password may
# be prompted for during create/destroy.

straps: [valet, mysql]

copy: [.env]

db_name: "myapp_{branch_slug}"

env:
  APP_URL: "https://{site}.test"
  APP_PORT: "{ports.app}"
  VITE_PORT: "{ports.vite}"

ports:
  app: 8080
  vite: 5173

hooks:
  create:
    - composer install
    - npm ci
    - npm run build
    # Keep APP_URL pointed at the actually-served name: for over-long
    # directory names the valet strap serves a shortened site instead.
    - "valet-site set-url APP_URL {site}"

aliases:
  serve: "php artisan serve --port {ports.app}"
  tinker: "php artisan tinker"
  migrate: "php artisan migrate"
  test: "php artisan test"
